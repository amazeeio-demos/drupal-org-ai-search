llm_configuration:
  max_tokens: 4096
  temperature: 1.0
  top_p: 1.0
actions_enabled: {  }
roles:
  anonymous: 0
  authenticated: 0
  administrator: 0
  author: 0
  editor: 0
use_function_calling: false
ai_agent: recipe_finder_assistant
