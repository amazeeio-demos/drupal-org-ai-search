name: 'drupal-org-ai-search pre-init'
type: AI
description: 'Pre-provider configuration and content for the Drupal AI Search demo: AI modules, the recipe finder assistant, the chatbot block and a welcome block.'
install:
  - ai_agents
  - ai_chatbot
  - ai_provider_litellm
  - ai_observability
  - ai_provider_openai
  - ai_search
  - contact
  - search_api_db
config:
  strict: false
  actions:
    # Default models must exist before the amazeeio_umami_search recipe runs
    # (its setupVdbServerWithDefaults action needs the embeddings default).
    # An action is used instead of a config/ai.settings.yml file because
    # ai.settings already exists once the ai module installs, and strict:false
    # skips existing config files silently.
    ai.settings:
      simpleConfigUpdate:
        default_providers:
          chat:
            provider_id: amazeeio
            model_id: chat_with_complex_json
          chat_with_complex_json:
            provider_id: amazeeio
            model_id: chat_with_complex_json
          chat_with_image_vision:
            provider_id: amazeeio
            model_id: chat_with_image_vision
          embeddings:
            provider_id: amazeeio
            model_id: embeddings
        default_vdb_provider: amazeeio_vector_db
    user.role.anonymous:
      grantPermissions:
        - 'access deepchat api'
        - 'access site-wide contact form'
    user.role.authenticated:
      grantPermissions:
        - 'access deepchat api'
        - 'access site-wide contact form'
